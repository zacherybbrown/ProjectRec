[package]
name = "project_rec"
version = "0.1.0"
authors = ["Project Rec Team <team@projectrec.example>"]
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.48", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
eframe = "0.28"

[profile.release]
strip = "symbols"
